name: website
on:
  push:
    branches: [main, 'codex/**']
    paths: ['website/**', 'core/deployments/**', 'eval/fixtures/localisation.json', 'eval/results/verified/20261014/**', 'docs/images/workspace-overview.png', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'core/deployments/**', 'eval/fixtures/localisation.json', 'eval/results/verified/20261014/**', 'docs/images/workspace-overview.png', '.github/workflows/website.yml']
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-checks
          path: website/test-results
          retention-days: 7
