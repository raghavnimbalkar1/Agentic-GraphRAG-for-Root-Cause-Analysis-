# Docker Compose file for Google Online Boutique microservice cluster
# Phase 1: Set up target environment for fault injection and chaos experiments

version: '3.8'

services:
  frontend:
    image: gcr.io/google-cloud-samples/microservices-demo/frontend:v0.3.9
    ports:
      - "80:8080"
    environment:
      - PORT=8080
      - PRODUCT_CATALOG_SERVICE_ADDR=productcatalog:3550
      - CART_SERVICE_ADDR=cartservice:7070
      - CHECKOUT_SERVICE_ADDR=checkout:5050
    depends_on:
      - productcatalog
      - cartservice
      - checkout

  productcatalog:
    image: gcr.io/google-cloud-samples/microservices-demo/productcatalogservice:v0.3.9
    environment:
      - PORT=3550
    ports:
      - "3550:3550"

  cartservice:
    image: gcr.io/google-cloud-samples/microservices-demo/cartservice:v0.3.9
    environment:
      - PORT=7070
      - REDIS_ADDR=redis-cart:6379
    ports:
      - "7070:7070"
    depends_on:
      - redis-cart

  checkout:
    image: gcr.io/google-cloud-samples/microservices-demo/checkoutservice:v0.3.9
    environment:
      - PORT=5050
    ports:
      - "5050:5050"

  redis-cart:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

  # Additional services can be added here (orderservice, paymentservice, etc.)

volumes:
  {}

networks:
  default:
    name: online-boutique-net
