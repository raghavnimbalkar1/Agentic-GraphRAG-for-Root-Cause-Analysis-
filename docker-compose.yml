# =============================================================
# Agentic GraphRAG RCA — Full Docker Compose
# =============================================================
#
# Phase usage guide:
#   Phase 1 (current):  docker compose up neo4j -d
#   Phase 3 (sim env):  docker compose up neo4j postgres-db redis-cache -d
#   Phase 4+ (full):    docker compose up -d
#
# All secrets come from .env file in project root.
# Never hardcode credentials here.
# =============================================================

version: "3.8"

# =============================================================
# NETWORKS
# =============================================================
networks:

  agent-net:
    # Agent ↔ Neo4j ↔ Docker daemon
    # Has outbound internet access for LLM API calls (OpenAI/Anthropic)
    driver: bridge
    name: agent-net

  sim-net:
    # Simulated microservices + sandbox executor
    # INTERNAL — no internet access, fully isolated
    driver: bridge
    internal: true
    name: sim-net

# =============================================================
# VOLUMES
# =============================================================
volumes:
  neo4j-data:     # Graph database files — never delete
  neo4j-logs:     # Neo4j application logs
  audit-logs:     # RCA reports written by agent


# =============================================================
# SERVICES
# =============================================================
services:

  # -----------------------------------------------------------
  # PHASE 1 — Graph Database
  # Start: docker compose up neo4j -d
  # -----------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j
    networks:
      - agent-net
    ports:
      - "7474:7474"   # Browser UI  → http://localhost:7474
      - "7687:7687"   # Bolt driver → bolt://localhost:7687
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      # Memory — tuned for 16GB Mac, adjust if needed
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      # Allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./graph/cypher:/import:ro     # Cypher init scripts (read-only)
    healthcheck:
      test: >
        cypher-shell
        -u neo4j
        -p ${NEO4J_PASSWORD}
        "RETURN 1"
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped


  # -----------------------------------------------------------
  # PHASE 4 — Docker-in-Docker Daemon (sandbox execution)
