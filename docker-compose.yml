  # -----------------------------------------------------------
  # PHASE 3 — Simulated Microservices
  # Start: docker compose up postgres-db redis-cache -d
  # -----------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    networks:
      - sim-net
    environment:
      POSTGRES_DB:       appdb
      POSTGRES_USER:     appuser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-simpassword}"
    ports:
      - "5433:5432"     # 5433 on host to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - simulation
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    networks:
      - sim-net
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"     # 6380 on host to avoid conflict with local redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - simulation
    restart: unless-stopped

  # payment-api, user-api, api-gateway, web-frontend
