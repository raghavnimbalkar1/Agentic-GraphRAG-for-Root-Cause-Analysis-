# =============================================================
# Agentic GraphRAG RCA — infrastructure compose
# =============================================================
#
#   docker compose up neo4j -d          # the dual-graph store (this file)
#
# The simulated microservice environment (Google Online Boutique,
# 12 services) lives in its own stack:
#
#   docker compose -f simulation/docker-compose.yml up -d
#
# The agent, telemetry collector, and dashboard run as local
# processes during development (see README "Running It").
# All secrets come from the .env file — never hardcode them here.
# =============================================================

networks:
  agent-net:
    # Agent ↔ Neo4j. Has outbound internet access for LLM API calls.
    driver: bridge
    name: agent-net

volumes:
  neo4j-data:     # Graph database files — never delete
  neo4j-logs:     # Neo4j application logs

services:

  neo4j:
    image: neo4j:5.18-community
    container_name: neo4j
    networks:
      - agent-net
    ports:
      - "7474:7474"   # Browser UI  → http://localhost:7474
      - "7687:7687"   # Bolt driver → bolt://localhost:7687
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      # Memory — tuned for a 16GB dev machine, adjust if needed
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      # Allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./graph/cypher:/import:ro     # Cypher init scripts (read-only)
    healthcheck:
      test: >
        cypher-shell
        -u neo4j
        -p ${NEO4J_PASSWORD}
        "RETURN 1"
        || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
